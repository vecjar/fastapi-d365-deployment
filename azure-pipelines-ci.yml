trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  azureSubscription: 'AzureFastAPIConnection'   # Your Azure service connection
  webAppName: 'fastapiproject-webapp'           # Your Web App name
  containerImage: 'vecjar/python-aca-app:latest' # Docker Hub image

steps:
# 1️⃣ Use Python 3.11
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.11'

# 2️⃣ Install Python dependencies
- script: |
    python -m pip install --upgrade pip
    pip install -r app/requirements.txt
  displayName: 'Install Python dependencies'

# 3️⃣ Build and Push Docker Image to Docker Hub
- task: Docker@2
  displayName: 'Build and Push Docker Image'
  inputs:
    command: 'buildAndPush'
    repository: 'vecjar/python-aca-app'
    dockerfile: 'app/Dockerfile'
    containerRegistry: 'DockerHub'   # Make sure this matches your service connection name
    tags: 'latest'

# 4️⃣ Deploy container to Azure Web App
- task: AzureWebApp@1
  displayName: 'Deploy Docker Container'
  inputs:
    azureSubscription: '$(azureSubscription)'
    appName: '$(webAppName)'
    package: ''  # leave empty for container deployment
    appSettings: |
      -DOCKER_CUSTOM_IMAGE_NAME $(containerImage)
