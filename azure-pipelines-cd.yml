trigger: none  # CD will only be triggered by CI, not by branch pushes

pool:
  vmImage: 'ubuntu-latest'

variables:
  azureSubscription: 'AzureFastAPIConnection'
  resourceGroup: 'fastapiproject-rg'
  webAppName: 'fastapiproject-webapp'
  containerImage: 'vecjar/python-aca-app:latest'  # Default, will be overridden by CI if needed

stages:

# -------------------------------------------------------------------
# Stage 1: Terraform Provisioning
# -------------------------------------------------------------------
- stage: Terraform_Provision
  displayName: 'Provision Infrastructure'
  jobs:
    - job: Terraform
      displayName: 'Terraform Job'
      steps:

        # Install Terraform
        - task: TerraformInstaller@1
          displayName: 'Install Terraform'
          inputs:
            terraformVersion: '1.6.2'

        # Run Terraform inside AzureCLI (login + apply in one step)
        - task: AzureCLI@2
          displayName: 'Terraform Init & Apply'
          inputs:
            azureSubscription: '$(azureSubscription)'
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              echo "Running Terraform..."
              cd terraform
              terraform init
              terraform apply -auto-approve

# -------------------------------------------------------------------
# Stage 2: Deploy Docker Container
# -------------------------------------------------------------------
- stage: Deploy_Container
  displayName: 'Deploy Docker Container'
  dependsOn: Terraform_Provision
  jobs:
    - job: Deploy
      displayName: 'Deploy Job'
      steps:
        - task: AzureWebAppContainer@1
          displayName: 'Deploy Docker Container'
          inputs:
            azureSubscription: '$(azureSubscription)'
            appName: '$(webAppName)'
            containers: '$(containerImage)'

# -------------------------------------------------------------------
# Trigger this CD pipeline automatically after CI succeeds
# -------------------------------------------------------------------
resources:
  pipelines:
    - pipeline: CI_Pipeline           # internal reference name
      source: 'Fast API Project'     # EXACT NAME of your CI pipeline
      trigger:
        branches:
          include:
            - main
